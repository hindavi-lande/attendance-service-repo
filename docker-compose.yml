services:
  postgres:
    image: postgres:16-alpine
    container_name: attendance-postgres
    environment:
      POSTGRES_DB: attendance_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - attendance-postgres-data:/var/lib/postgresql/data

volumes:
  attendance-postgres-data:
